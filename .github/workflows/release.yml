name: Release

# Tag push (vX.Y.Z) builds the Windows installers and attaches them to a draft
# GitHub Release. Nothing is published until a human clicks Publish on the draft.
on:
  push:
    tags: ["v*"]

jobs:
  release:
    name: Build Windows installers
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      # Releases are unsigned: no cert, no signing secret. Windows may show a
      # SmartScreen "unknown publisher" prompt on first install.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "MidiTrainer ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false
