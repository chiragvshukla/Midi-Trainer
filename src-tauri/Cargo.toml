[package]
name = "midi-trainer"
version = "0.1.0"
description = "MidiTrainer - a MIDI piano trainer with falling-note and sheet-music views"
authors = ["MidiTrainer contributors"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "midi_trainer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
# midly (MIT): parses Standard MIDI Files, including tempo, time signature and lyric meta
# events. Hand-rolling an SMF parser is several hundred lines of untrusted-input code.
midly = "0.5"
# cpal (MIT/Apache-2.0): cross-platform audio output (WASAPI/CoreAudio/ALSA).
cpal = "0.15"
# rustysynth (MIT): pure-Rust SoundFont (.sf2) synthesis, no C or system libraries.
rustysynth = "1.3"
# crossbeam-queue (MIT/Apache-2.0): bounded lock-free ArrayQueue carrying audio commands
# from the control and MIDI threads to the audio callback without blocking it.
crossbeam-queue = "0.3"
log = "0.4"
env_logger = "0.11"


# AGENTS.md bans println!/eprintln! outside tests: they panic in release GUI
# builds on Windows (no console) and panic = "abort" takes the app down.
[lints.clippy]
print_stdout = "deny"
print_stderr = "deny"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
